name: Integrations

# emfor with other software: nginx and HAProxy taking their servers from
# emfor's SRV answers (docs/manual/07-dns.md, "Using it with nginx" and "Using
# it with HAProxy"), and a rolling deploy over nginx with drain
# (docs/manual/08-operations.md, "Rolling deploy with drain"), Prometheus and
# Caddy finding their targets from them ("Using it with Prometheus" and "Using
# it with Caddy"). What these tests
# can catch is a new nginx or HAProxy that behaves differently (the images are
# the floating tags stable, mainline and lts), and a change in emfor's answers.
# So they run once a week and when those parts of emfor or the tests change,
# not on every push (CI does that).
# Start them by hand from the Actions tab (or `gh workflow run Integrations`).
on:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches: [main]
    paths:
      - "crates/emfor-daemon/src/dns.rs"
      - "crates/emfor-daemon/src/select.rs"
      - "crates/emfor-format/**"
      - "tests/nginx/**"
      - "tests/haproxy/**"
      - "tests/deploy/**"
      - "tests/prometheus/**"
      - "tests/caddy/**"
      - "examples/deploy/**"
      - ".github/workflows/integrations.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  nginx:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ["nginx:stable", "nginx:mainline"]
    steps:
      - uses: actions/checkout@v7
      - run: tests/nginx/run.sh ${{ matrix.image }}

  haproxy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ["haproxy:lts", "haproxy:2.8"]
    steps:
      - uses: actions/checkout@v7
      - run: tests/haproxy/run.sh ${{ matrix.image }}

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ["nginx:stable", "nginx:mainline"]
    steps:
      - uses: actions/checkout@v7
      - run: tests/deploy/run.sh ${{ matrix.image }}

  prometheus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: tests/prometheus/run.sh prom/prometheus

  caddy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: tests/caddy/run.sh caddy
