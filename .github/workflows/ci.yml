name: CI

# Runs on every push to main and on every pull request; it can also be
# started by hand from the Actions tab (or `gh workflow run CI`). A change
# that only touches docs/spectra (the Spectra change records and specs, which
# no test reads) does not start it. The manual and the other docs do:
# clients/rust/tests/versions.rs and tests/resolver/ read them.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/spectra/**"
  pull_request:
    paths-ignore:
      - "docs/spectra/**"
  workflow_dispatch:

# The jobs only read the repository.
permissions:
  contents: read

# A new push to a pull request cancels the run it replaces; a push to main
# is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      # A pull request restores the cache of main but does not save its own:
      # the cache of a pull request is read by that pull request only, and the
      # ones of 6, 7 and 8 held about 2.9 GB of the 10 GB the repository gets.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - name: dnsmasq recipe
        run: tests/resolver/run.sh dnsmasq
      - name: unbound recipe
        run: tests/resolver/run.sh unbound
      - name: systemd-resolved recipe
        run: tests/resolver/resolved.sh

  # The fuzz targets are built by no other job, and crates/emfor-daemon/src/
  # dns_fuzz.rs compiles only with `--cfg fuzzing`: a change to a type it
  # builds (BackendRecord) broke all six targets in 0.6.0 and nothing noticed
  # until the fuzz run of the release. This only type-checks them, on stable:
  # no nightly, cargo-fuzz or sanitizer, and nothing runs.
  fuzz-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --manifest-path fuzz/Cargo.toml --bins --locked
        env:
          RUSTFLAGS: --cfg fuzzing

  # Cargo.lock against the RustSec advisories, the licences in deny.toml, and
  # the crate sources. The advisory database changes without any commit here,
  # so this job can start failing on an unchanged tree: a new advisory is the
  # usual reason. The fuzz workspace has its own Cargo.lock and is checked
  # too.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2
        with:
          command: check advisories licenses bans sources
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2
        with:
          manifest-path: fuzz/Cargo.toml
          command: check advisories licenses bans sources

  freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The oldest release still supported and the newest one. One failing
    # does not cancel the other.
    strategy:
      fail-fast: false
      matrix:
        release: ["14.5", "15.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1
        with:
          release: ${{ matrix.release }}
          usesh: true
          # Nothing the job needs comes back from the VM. The default copies
          # the whole workspace, target/ included (2.3 GB), to the runner:
          # 25 seconds when it works, over 2 minutes and a lost connection
          # (rsync exit 255) on the 14.5 run of cf050bd, after every test passed.
          copyback: false
          # cargo-c, pkgconf, python3 and PHP with FFI: client spike 2
          # (tests/spike/RESULTS.md). The PHP dba same-process check runs
          # only if the php84-dba build has the lmdb handler.
          prepare: pkg install -y rust cargo-c pkgconf python3 php84 php84-ffi php84-dba
          run: |
            rustc --version
            # The tests that chown a file or switch users return at once
            # unless this is 0 (the log shows whether they ran).
            id -u
            cargo test --locked --workspace --all-features
            # The Rust fork tests (fork_threads, fork_guard*) ran above; the
            # C ones need this script (BSD make cannot run clients/Makefile).
            # A child forked while other threads look up can hang in libthr:
            # docs/freebsd/libthr-pshared-fork.md.
            sh tests/clients/fork.sh
            # The spike fetches crates; the resolver script makes
            # local_unbound the system resolver and leaves it, which once
            # left the spike without DNS (run 43790442582). So it goes last.
            sh tests/spike/run.sh 2
            sh tests/resolver/freebsd.sh

  # The C library and the Go, Python, Perl and PHP wrappers: each one's tests
  # and the shared conformance driver (make -C clients test).
  clients:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config golang-go python3 libperl-dev php-dev php-cli php-dba
      # Pinned, so that a new cargo-c release does not change the job. The
      # binaries come back with rust-cache (it keeps ~/.cargo/bin), so only
      # the first run, or one after the version changes, builds it.
      - name: Install cargo-c
        run: cargo install cargo-c --locked --version 0.10.26
      - run: make -C clients test
        env:
          # The PHP test must run the same-process check with dba's lmdb.
          EMFOR_REQUIRE_DBA: "1"
