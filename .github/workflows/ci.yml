name: CI

# Disabled for now: runs only when started by hand from the Actions tab
# (or `gh workflow run CI`). Restore push / pull_request to turn it back on.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - name: dnsmasq recipe
        run: tests/resolver/run.sh dnsmasq
      - name: unbound recipe
        run: tests/resolver/run.sh unbound
      - name: systemd-resolved recipe
        run: tests/resolver/resolved.sh

  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          usesh: true
          # cargo-c, pkgconf, python3 and PHP with FFI: client spike 2
          # (tests/spike/RESULTS.md). The PHP dba same-process check runs
          # only if the php84-dba build has the lmdb handler.
          prepare: pkg install -y rust cargo-c pkgconf python3 php84 php84-ffi php84-dba
          run: |
            rustc --version
            cargo test --workspace --all-features
            sh tests/resolver/freebsd.sh
            sh tests/spike/run.sh 2

  # The C library and the Go, Python, Perl and PHP wrappers: each one's tests
  # and the shared conformance driver (make -C clients test).
  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config golang-go python3 libperl-dev php-dev php-cli php-dba
          cargo install cargo-c --locked
      - run: make -C clients test
        env:
          # The PHP test must run the same-process check with dba's lmdb.
          EMFOR_REQUIRE_DBA: "1"
