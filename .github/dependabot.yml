# Dependabot opens pull requests for newer crate versions and newer
# versions of the actions the workflows use. It does not merge anything.
#
# Not listed: clients/go has no dependencies (go.mod has no require lines) and
# clients/python has no runtime dependencies, so there is nothing to update.
#
# A crate update changes Cargo.lock. packages/freebsd/Makefile.crates is
# generated from Cargo.lock (RELEASING.md), so regenerate it in the same pull
# request before merging. fuzz/Cargo.lock is not touched by an update of the
# main workspace: when the update changes a dependency of a crate the fuzz
# targets use, update fuzz/Cargo.lock in the same pull request too (a `cargo
# check --manifest-path fuzz/Cargo.toml --bins` without `--locked` rewrites it;
# `cargo update` would also move crates the update did not touch). CI fails
# until both are done: the test freebsd_port_lists_the_locked_crates for
# Makefile.crates, and the fuzz-build job (`--locked`) for fuzz/Cargo.lock.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One pull request for the patch and minor updates of the week; a major
      # update stays on its own.
      cargo-minor:
        update-types: [minor, patch]

  # The fuzz targets are their own workspace, with their own Cargo.lock.
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      cargo-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  # The base image of the package build, pinned by digest. The versions of
  # cargo-deb and cargo-generate-rpm in the same file are not tracked.
  - package-ecosystem: docker
    directory: /packages
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
