<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" font-family="-apple-system, 'Helvetica Neue', Arial, 'PingFang TC', 'Noto Sans TC', sans-serif">
<rect width="1100" height="590" fill="#ffffff"/>
<text x="30" y="44" font-size="26" font-weight="700" fill="#1f2937" text-anchor="start">How emfor fits on one host</text>
<rect x="30" y="110" width="200" height="110" rx="12" fill="#f8fafc" stroke="#9aa1ab" stroke-width="2"/>
<text x="130" y="172" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">backends</text>
<rect x="400" y="100" width="300" height="130" rx="12" fill="#eaf1ff" stroke="#2f6fde" stroke-width="2.5"/>
<text x="550" y="160" font-size="21" font-weight="700" fill="#1f2937" text-anchor="middle">emfor daemon</text>
<text x="550" y="192" font-size="14" font-weight="400" fill="#5b6472" text-anchor="middle">one per host, no central server</text>
<line x1="400" y1="165" x2="243.0" y2="165.0" stroke="#2f6fde" stroke-width="3"/>
<polygon points="232,165 243.0,159.0 243.0,171.0" fill="#2f6fde"/>
<text x="312" y="152" font-size="13" font-weight="600" fill="#2f6fde" text-anchor="middle">checks over the network</text>
<rect x="800" y="100" width="270" height="130" rx="12" fill="#ffffff" stroke="#9aa1ab" stroke-width="1.5"/>
<text x="935" y="148" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">DNS on 127.0.0.1</text>
<text x="935" y="176" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle">for programs without a client library;</text>
<text x="935" y="196" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle">answered from the daemon's memory</text>
<line x1="702" y1="165" x2="787.0" y2="165.0" stroke="#5b6472" stroke-width="2"/>
<polygon points="798,165 787.0,171.0 787.0,159.0" fill="#5b6472"/>
<rect x="380" y="300" width="340" height="90" rx="12" fill="#e8f6ed" stroke="#1f7a3d" stroke-width="2.5"/>
<text x="550" y="339" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">local LMDB state store</text>
<text x="550" y="367" font-size="14" font-weight="400" fill="#5b6472" text-anchor="middle">the daemon is its only writer</text>
<line x1="550" y1="232" x2="550.0" y2="287.0" stroke="#1f7a3d" stroke-width="3"/>
<polygon points="550,298 544.0,287.0 556.0,287.0" fill="#1f7a3d"/>
<text x="566" y="272" font-size="14" font-weight="600" fill="#1f7a3d" text-anchor="start">writes</text>
<rect x="180" y="450" width="360" height="80" rx="12" fill="#ffffff" stroke="#9aa1ab" stroke-width="1.5"/>
<text x="360" y="484" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">client library</text>
<text x="360" y="510" font-size="14" font-weight="400" fill="#5b6472" text-anchor="middle">Rust, C, Go, Python, Perl, PHP</text>
<rect x="600" y="450" width="320" height="80" rx="12" fill="#ffffff" stroke="#9aa1ab" stroke-width="1.5"/>
<text x="760" y="484" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" font-family="Menlo, Consolas, monospace">emfor status</text>
<text x="760" y="510" font-size="14" font-weight="400" fill="#5b6472" text-anchor="middle">also usable as a monitoring check</text>
<line x1="470" y1="448" x2="512.6738265376026" y2="400.20531427788507" stroke="#5b6472" stroke-width="2"/>
<polygon points="520,392 517.1494525073581,404.2014088937382 508.19820056784715,396.20921966203196" fill="#5b6472"/>
<line x1="760" y1="448" x2="649.968014539948" y2="396.65174011864235" stroke="#5b6472" stroke-width="2"/>
<polygon points="640,392 652.5053273319347,391.21464127867074 647.4307017479612,402.08883895861396" fill="#5b6472"/>
<text x="584" y="425" font-size="14" font-weight="600" fill="#5b6472" text-anchor="middle">reads</text>
<text x="30" y="570" font-size="14" font-weight="400" fill="#5b6472" text-anchor="start">Lookups read only the local store: no network, about a microsecond.</text>
</svg>
