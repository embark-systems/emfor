schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  emfor：每台應用主機各跑一份的健康檢查 daemon。依設定檢查後端健康狀態，
  告訴應用程式該連哪台後端；實際流量不經過 emfor。用語以 docs/spectra/LANGUAGE.md 為準。

  技術棧：
  - daemon：Rust、tokio；DNS 用 hickory-server；LMDB 用 heed；設定檔 TOML（humantime-serde 解析時間）
  - client：Rust crate emfor-client（heed，與 daemon 同一份 Cargo.lock）以 cargo-c 產出 C library libemfor；
    C 直接連結，Go（cgo）、Python（ctypes）、Perl（FFI::Platypus 或 XS）、PHP（extension 或 FFI，emfor-clients-2 決定）
    包裝 libemfor 的動態函式庫。不使用系統 liblmdb、PHP dba 或各語言自帶的 LMDB 套件。

  核心決定：
  - 對外介面只有兩條：本機 LMDB（給 client）與只聽 127.0.0.1 的 DNS（給沒有 client 的程式）。不做 HTTP API / gRPC。
  - LMDB 由 daemon 單獨寫入：單一檔案（MDB_NOSUBDIR）、只用預設資料庫、UTF-8 key（svc/<服務名>）+ JSON value，
    含 meta/schema_version、全域心跳、每筆 checked_at。daemon 重啟不沿用舊狀態。
  - client 只提供 emfor_lookup(名稱, affinity_key?) → IP；fork 後自動重新開啟 LMDB；心跳過期回報狀態未知。
  - 分配方式由設定檔決定：每個服務（或 [defaults]）設 balance，daemon 寫入 LMDB 服務記錄的 "balance" 欄位
    （直接加進格式版本 1，不升版），client 與 DNS 都依它挑選。第一版的值：
    round-robin（預設；DNS 全域輪流，client 僅程序內輪流、起點隨機）、
    sticky（有 affinity_key 用 rendezvous hashing，MD5 前 4 bytes big-endian；無 key 含 DNS 改用 round-robin）、
    failover（設定檔順序中第一台健康的後端）。round-robin 與 failover 忽略 affinity_key。
  - DNS（emfor-dns）：只回答自己負責的網域，不轉發其他網域；由本機 resolver 依網域轉發過來，
    emfor 不當整台機器的 DNS，掛掉時只影響自己的網域。
    [dns] 區段存在才啟用；listen 預設 ["127.0.0.1:5300"]（不用 5353：那是 mDNS，macOS 與 avahi 會佔用）、可列多個位址；UDP 與 TCP；
    zone 可設定，預設 "svc.emfor"，只有名稱在 zone 底下的服務能用 DNS 查到。
    A（IPv4 後端）與 AAAA（IPv6 後端），各自依 balance 挑選，每次回一個 IP；
    TTL 預設 1 秒，每個服務可覆寫。資料直接讀 daemon 記憶體中的狀態，不經 LMDB。
    回應：zone 以外 REFUSED；zone 內查無服務 NXDOMAIN（附 SOA）；服務無該 IP 版本的後端回空答案（NODATA）；
    全部不健康且 on_all_down = "closed" 回 SERVFAIL；"open" 時從所有後端挑選。
    重載：zone、ttl 可重載；listen 變更需重啟（同 [store]）。
    交付部署文件 docs/deploy/dns-resolver.md：dnsmasq、unbound（含 FreeBSD local_unbound，需 domain-insecure
    與 do-not-query-localhost: no）、systemd-resolved、macOS /etc/resolver；每節附直接查 emfor 與經系統 resolver
    查詢的驗證指令，以及快取（最短快取時間、負快取）注意事項。dnsmasq 與 unbound 的設定以容器自動測試驗證；
    systemd-resolved、macOS 手動驗證並註明驗證版本。
  - 檢查器統一介面（validate / check），結果 up / down / error，error 不算後端失敗。
    tcp、http、exec 內建；外部外掛為常駐子程序，stdin/stdout 逐行 JSON，帶握手與協定版本。
  - 外掛（emfor-plugins）：
    exec：command 為陣列、不經 shell，每次檢查起一個程序，EMFOR_IP / EMFOR_PORT / EMFOR_SERVICE 環境變數；
    結束碼採 Nagios 慣例：0 up、1/2 down（原因取 stdout 第一行）、3 以上或被 signal 終止或無法執行為 error；
    逾時殺掉整個 process group，結果 down("timeout")。
    外部外掛：每個 [plugins.<名稱>] 一個常駐子程序，所有服務共用；請求帶 id、可亂序回覆；
    訊息 hello（協定版本 1）/ validate / check，每次 check 帶完整 options 與 timeout_ms；stderr 轉進 daemon log；
    當掉時重啟，退避 1 秒起倍增、上限 30 秒，期間檢查回 error。
    載入、重載、--check-config 都實際啟動外掛並請它驗證 check_options；無法啟動、握手失敗、驗證逾時（5 秒）
    皆為設定錯誤。外掛超過 timeout_ms 未回覆算 error（外掛應自行在期限內回 down），不算後端失敗。
  - client（emfor-clients）：emfor_lookup(名稱, affinity_key?) 回傳 "ip:port"（LMDB 後端 id，IPv6 為 [ip]:port）；
    錯誤碼 UNAVAILABLE（LMDB 打不開／lock 格式不符）、INCOMPATIBLE（版本或 JSON 無法解析）、NOT_FOUND、ALL_DOWN，
    各語言依慣例回報。心跳過期（預設 max_staleness 3 秒）或歸零時所有後端視為未知，依 on_all_down 處理，
    不另設錯誤碼；全部不健康但照樣回傳時第一版不另行通知呼叫端。round-robin 每程序每服務一個 atomic 計數器、
    起點隨機；sticky 對每台後端算 MD5(affinity_key + 後端 id) 前 4 bytes big-endian 取最大，無 key 用 round-robin。
    設定只有預設值加環境變數 EMFOR_STORE、EMFOR_MAX_STALENESS；唯讀開檔、每程序開一次、fork 後重開、可多執行緒呼叫。
    跨語言共用測試資料放 tests/conformance/v1/（JSON：LMDB 內容 + 查詢 → 預期 ip:port 或錯誤碼），
    由 Rust 小工具 emfor-fixture 轉成 LMDB 檔。
    相容性驗證結果（2026-11-12，tests/spike/RESULTS.md）：系統 liblmdb 與 PHP dba 都讀不了 daemon 的 store
    （Debian 0.9.31 資料檔相容但 lock 格式不同；macOS Homebrew 1.0.3 連資料檔都不認得；Homebrew PHP 沒有 lmdb handler），
    因此 client 改為內嵌 daemon 同一份 LMDB：emfor-client 經 cargo-c 產出 libemfor，cdylib 不對外公開 mdb_* 符號，
    各語言只包裝動態函式庫（不用 .a）。libemfor 與 emfor 同版本一起發布、一起升級。
    讀取保留 MDB_NOTLS：每次交易結束歸還讀取槽；不用 MDB_NOTLS 時每條執行緒會一直佔用一個讀取槽，
    而槽數由 daemon 建立 lock 檔時決定（預設 126，全主機共用）。實測一次查詢 Linux 約 0.2–1.7 µs，SQLite WAL 約 2–6 µs，
    效能不是選擇依據。
  - 設定：全域 [defaults] + 每個服務覆寫（interval、timeout、rise、fall、jitter、on_all_down）；
    check_options 交給檢查器驗證；SIGHUP 重載時全部驗證通過才套用。
  - 全部不健康時預設 open（照樣回傳並標記 all_down），可依服務改 closed。
  - LMDB 退場機制：只有 cargo-c 版 libemfor 的驗證也失敗（讀不了 daemon 的 store，或同一程序載入其他 LMDB 時衝突）
    才改用 SQLite WAL（kv 表沿用現有 key 與 JSON、schema_version 升 2、persistent WAL、daemon 新增 SQLite 版 Sink），
    另開 emfor-sqlite-store；效能不構成退場理由。完整判斷步驟寫在 emfor-clients 的 design.md。

  支援平台：Linux 與 FreeBSD 為正式部署平台（daemon 與所有 client 都要在兩者上通過測試，CI 含 FreeBSD VM），
  macOS 僅作開發用。FreeBSD 附 rc.d 範例（不做打包）。client 與 daemon 必須用同一份 LMDB 原始碼與編譯選項，
  否則 lock 格式不同（MDB_VERSION_MISMATCH），這由 libemfor 與 daemon 共用 Cargo.lock 保證。

  跨語言相容規格（皆帶版本號，以共用測試資料把關）：LMDB 資料格式、外掛訊息格式、affinity_key 分配演算法。

  第一版不做：多台 emfor 同步、stick-table、DNS 名稱帶條件、DNS 轉發其他網域、發佈到套件庫、
  Docker / Kubernetes 的 DNS 部署（容器內 DNS 路徑不同，需另行設計）。

  後續規劃（已決定要做、尚未排入 change；用語見 LANGUAGE.md「分配方式的值」）：
  - balance = "random"：健康後端中均勻隨機。
  - balance = "fastest"：最近一次檢查延遲最低；LMDB 需記錄檢查延遲，並設計防止所有 client 湧向同一台的分散機制。
  - balance = "weighted"：後端可設 weight，依比例挑選。
  - balance = "zone"：後端可加標籤，client 需知道自己所在機房，優先挑同機房後端。
  - DNS SRV 記錄：需為每台後端產生名稱（例如 b0.api.svc.emfor）作為 SRV 目標，讓支援的程式取得 port。
  - DNS port 一致性警告：服務在 DNS 網域內但後端 port 不一致時，daemon 啟動與重載時發 warn（經 DNS 只能拿到 IP）。

  變更拆分：emfor-core（已完成）→ emfor-dns（含 balance 設定欄位、LMDB 欄位、DNS 端行為、resolver 部署文件、FreeBSD CI 與 rc.d 範例）
  → emfor-plugins（已完成）→ emfor-clients（相容性驗證、client-lookup 規格、共用測試資料、Rust client 與 cargo-c 產出的 libemfor）
  → emfor-clients-2（Go、Python、Perl、PHP 包裝 libemfor）→ 後續規劃中的分配方式。

