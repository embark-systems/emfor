schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  emfor：每台應用主機各跑一份的健康檢查 daemon。依設定檢查後端健康狀態，
  告訴應用程式該連哪台後端；實際流量不經過 emfor。用語以 docs/spectra/LANGUAGE.md 為準。

  技術棧：
  - daemon：Rust、tokio；DNS 用 hickory-server；LMDB 用 heed；設定檔 TOML（humantime-serde 解析時間）
  - client：Rust crate emfor-client（heed，與 daemon 同一份 Cargo.lock）以 cargo-c 產出 C library libemfor；
    C 直接連結，Go（cgo，emfor.Lookup）、Python（ctypes，emfor.lookup）、Perl（XS，Emfor::lookup）、
    PHP（C extension，Emfor\lookup；不用 FFI，因 ffi.enable 預設 preload 擋住 php-fpm）
    包裝 libemfor 的動態函式庫。不使用系統 liblmdb、PHP dba 或各語言自帶的 LMDB 套件。

  核心決定：
  - 對外介面：本機 LMDB（給 client）、只聽 127.0.0.1 的 DNS（給沒有 client 的程式），以及唯讀的 Prometheus /metrics。不做 HTTP API / gRPC。
  - LMDB 由 daemon 單獨寫入：單一檔案（MDB_NOSUBDIR）、只用預設資料庫、UTF-8 key（svc/<服務名>）+ JSON value，
    含 meta/schema_version、全域心跳、每筆 checked_at。daemon 重啟不沿用舊狀態。
  - client 只提供 emfor_lookup(名稱, affinity_key?) → IP；fork 後自動重新開啟 LMDB；心跳過期回報狀態未知。
  - 分配方式由設定檔決定：每個服務（或 [defaults]）設 balance，daemon 寫入 LMDB 服務記錄的 "balance" 欄位
    （直接加進格式版本 1，不升版），client 與 DNS 都依它挑選。第一版的值：
    round-robin（預設；DNS 全域輪流，client 僅程序內輪流、起點隨機）、
    sticky（有 affinity_key 用 rendezvous hashing，MD5 前 4 bytes big-endian；無 key 含 DNS 改用 round-robin）、
    failover（設定檔順序中第一台健康的後端）。round-robin 與 failover 忽略 affinity_key。
    emfor-balance-2 新增：weighted（後端 weight 1–100，預設 1；每 W 次挑選各後端剛好 weight 次，
    W 為候選權重總和；client 用輪流計數器對 W 取餘數落在累積權重區間，DNS 用 smooth weighted round-robin）、
    locality（設定檔最上層 site 為本機機房，daemon 寫入 meta/site；後端可設 site；健康篩選後優先同 site 的後端，
    沒有就用全部，再以 round-robin 挑選）。後端可寫成字串或 { addr, weight, site } 表格。
    emfor-balance-fastest 新增：fastest（daemon 量每次 up 檢查的時間，新樣本權重 0.05 的指數移動平均寫成後端 latency_us；
    健康且有延遲的後端中，延遲 ≤ max(最低 × 1.5, 最低 + 1 ms) 進入快組、> max(最低 × 2, 最低 + 2 ms) 才離開；
    快組寫成服務記錄的 pool（只有 fastest 服務有），client 與 DNS 在 pool 裡輪流，pool 空或心跳過期時等同 round-robin）。
    client 讀到不認得的 balance 值時改用 round-robin（忽略 affinity_key），不回 INCOMPATIBLE。
  - DNS（emfor-dns）：只回答自己負責的網域，不轉發其他網域；由本機 resolver 依網域轉發過來，
    emfor 不當整台機器的 DNS，掛掉時只影響自己的網域。
    [dns] 區段存在才啟用；listen 預設 ["127.0.0.1:5300"]（不用 5353：那是 mDNS，macOS 與 avahi 會佔用）、可列多個位址；UDP 與 TCP；
    zone 可設定，預設 "svc.emfor"，只有名稱在 zone 底下的服務能用 DNS 查到。
    A（IPv4 後端）與 AAAA（IPv6 後端），各自依 balance 挑選，每次回一個 IP；
    TTL 預設 1 秒，每個服務可覆寫。資料直接讀 daemon 記憶體中的狀態，不經 LMDB。
    回應：zone 以外 REFUSED；zone 內查無服務 NXDOMAIN（附 SOA）；服務無該 IP 版本的後端回空答案（NODATA）；
    全部不健康且 on_all_down = "closed" 回 SERVFAIL；"open" 時從所有後端挑選。
    重載：zone、ttl 可重載；listen 變更需重啟（同 [store]）。
    SRV（emfor-dns-srv）：回答在服務名稱本身與 _<任意>._tcp.<服務名稱>（_tcp.<服務名稱> 為空節點、不支援 _udp）；
    回傳全部候選後端（兩種 IP 版本合併判斷健康；全部不健康 closed 回 SERVFAIL），balance 對應 SRV：
    failover 依候選順序給 priority 0、1、2…；weighted 的 SRV weight = 後端 weight；locality 同 site priority 0、其他 1；fastest 的 pool 成員 priority 0、其他 1；
    round-robin、sticky、不認得的值同 priority 並輪換順序（每個服務一個獨立的 SRV 計數器）。
    target 由 IP 推出：IPv4 如 10-0-0-11.<服務名稱>，IPv6 用完整 8 組 4 位數（如 2001-0db8-0000-0000-0000-0000-0000-0011），
    target 名稱本身可查 A/AAAA（不論健康狀態）；A/AAAA 放 additional 區段。
    UDP 上限為 client 的 EDNS 大小限制在 512–1232（無 EDNS 為 512）：放不下先整批拿掉 additional（不設 TC），
    SRV 本身放不下才截斷並設 TC（由 emfor 自行截斷，保留 OPT 記錄）。
    port 一致性警告（emfor-dns-port-warning）：zone 內服務的後端 port 不一致時（兩種 IP 版本合併計算），
    daemon 啟動與重載成功後各發一行 warn，列出服務名稱與各 port，提醒 A/AAAA 不帶 port、需改用 SRV 或 client；
    zone 外的服務只有原本的 zone 外警告；不影響回答、設定有效性與 --check-config。
    交付部署文件 docs/deploy/dns-resolver.md：dnsmasq、unbound（含 FreeBSD local_unbound，需 domain-insecure
    與 do-not-query-localhost: no）、systemd-resolved、macOS /etc/resolver；每節附直接查 emfor 與經系統 resolver
    查詢的驗證指令，以及快取（最短快取時間、負快取）注意事項。dnsmasq 與 unbound 的設定以容器自動測試驗證；
    systemd-resolved、macOS 手動驗證並註明驗證版本。
  - 監控指標（emfor-metrics）：[metrics] 區段存在才啟用；listen 預設 ["127.0.0.1:5301"]（不用 9312：Prometheus
    預設埠清單刻意保留給 Sphinx）、可列多個位址；listen 變更需重啟（同 [dns]）。自寫最小 HTTP/1.1 伺服器，只回答
    GET /metrics（Prometheus 文字格式 0.0.4），其他路徑 404、其他方法 405、head 錯誤或超過 8192 位元組 400，
    5 秒內沒送完 head 直接關閉，最多 16 條同時連線，每次回應後關閉連線。資料讀 daemon 記憶體中的狀態，不經 LMDB。
    指標：後端 state（三個一熱序列）、check latency、last check timestamp、fastest 的 in_pool、服務 all_down、
    後端 checks_total{result} 與 transitions_total{to}（後端出現於執行中 daemon 起算，reload 保留、移除即歸零）、
    build_info、start_time、store commit failures。實測 10 台後端約 104 條序列、10.6 KB。
  - 檢查器統一介面（validate / check），結果 up / down / error，error 不算後端失敗。
    tcp、http、exec 內建；外部外掛為常駐子程序，stdin/stdout 逐行 JSON，帶握手與協定版本。
    tcp（emfor-tcp-expect）：可選 send（連上後送出，TOML 字串原樣送出）與 expect（回應須含此子字串，位元組比對）；
    只設 expect 為歡迎訊息模式；send 無 expect、expect 為空或超過 16384 位元組為設定錯誤；最多讀 16384 位元組，
    符合即關閉；對方關閉或讀滿仍未符合為 down，原因 expect: got "<前 64 位元組，escape_ascii>"；寫入失敗 send: 、讀取失敗 expect: 。
    不做 regex、多步驟、二進位比對。
    tcp TLS（emfor-tcp-tls）：tls（預設 false，不退回明文）、tls_verify、server_name（預設後端 IP）、ca_file（預設系統 CA），
    與 emfor-check 同名同義、驗證訊息相同；握手後才做 send / expect，無 expect 時握手成功即 up 並送 close_notify。
    TLS 程式碼在內部 crate crates/emfor-tls（信任清單、tls_verify = false 的驗證器、握手時間預算、選項檢查），
    daemon 的 tcp 檢查與 emfor-check 共用；不做 mTLS、憑證到期警告、STARTTLS。http 檢查的 TLS 不變（reqwest）。
  - 外掛（emfor-plugins）：
    exec：command 為陣列、不經 shell，每次檢查起一個程序，EMFOR_IP / EMFOR_PORT / EMFOR_SERVICE 環境變數；
    結束碼採 Nagios 慣例：0 up、1/2 down（原因取 stdout 第一行）、3 以上或被 signal 終止或無法執行為 error；
    逾時殺掉整個 process group，結果 down("timeout")。
    外部外掛：每個 [plugins.<名稱>] 一個常駐子程序，所有服務共用；請求帶 id、可亂序回覆；
    訊息 hello（協定版本 1）/ validate / check，每次 check 帶完整 options 與 timeout_ms；stderr 轉進 daemon log；
    當掉時重啟，退避 1 秒起倍增、上限 30 秒，期間檢查回 error。
    載入、重載、--check-config 都實際啟動外掛並請它驗證 check_options；無法啟動、握手失敗、驗證逾時（5 秒）
    皆為設定錯誤。外掛超過 timeout_ms 未回覆算 error（外掛應自行在期限內回 down），不算後端失敗。
  - 內附外掛（emfor-check-plugins）：emfor-check 一個執行檔，第一個參數選 redis / mysql / pgsql / ldap / dns / radius / sip / diameter；
    crates/emfor-plugin 處理 protocol 1（emfor-check 與其他 Rust 外掛共用）。每次檢查開新連線；
    redis PING（有密碼先 AUTH）、mysql 與 pgsql 登入後 SELECT 1；role：redis master/replica（ROLE）、
    mysql primary（@@global.read_only = 0）、pgsql primary（pg_is_in_recovery() 為 false），可搭配 failover。
    帳號選項一律叫 user；密碼只用 password_file（絕對路徑，每次檢查重讀，去掉一個結尾換行），不接受 password。
    TLS：tls（預設 false，不退回明文）、tls_verify、server_name（預設後端 IP）、ca_file（預設系統 CA），
    tls = false 時設定後三者為錯誤；全部用 rustls（aws-lc-rs）。原因前綴：connect: / timeout / tls: / auth: /
    query: / role is …（down）；password_file: / ca_file: 讀不到為 error。驅動只連結進 emfor-check。
    實機測試 tests/plugins/run.sh（Debian 映像 emfor-plugins-test：redis、MariaDB、PostgreSQL 各含主從與 TLS），
    列入本機檢查；mysql 只以 MariaDB 驗證。
  - ldap 外掛（emfor-check-ldap）：emfor-check ldap 做 LDAPv3 simple bind（無 user 為匿名，user 為 DN 並需
    password_file），resultCode 0 為 up，之後送 unbind 並關閉；不做 SASL、搜尋、role。BER 自己寫（ber.rs），
    不新增相依，回應上限 65536 位元組。tls = true 為 LDAPS；starttls = true（僅 ldap，與 tls 互斥）先明文送
    StartTLS ExtendedRequest 再以 emfor-tls 握手，TLS 相關鍵需要 tls 或 starttls。原因：auth: <code> <name>[: 診斷]、
    tls: StartTLS refused: <code> <name>、格式錯誤或 Notice of Disconnection 為 query:。實機測試用 OpenLDAP slapd
    （389 StartTLS、636 LDAPS、3389 無 TLS）。
  - dns 外掛（emfor-check-dns）：emfor-check dns 送一個 DNS 查詢（hickory-proto，與 daemon 同版本），規格在
    network-checks（資料庫外掛仍在 database-checks）。選項 name、type（A/AAAA/CNAME/MX/NS/PTR/SOA/SRV/TXT）、
    transport（udp/tcp）、recursion_desired、expect_rcode（預設 NOERROR）、expect_answer；不做 DoT/DoH、DNSSEC。
    UDP 交換在 net.rs 共用（connected socket、timeout 一半時重送一次、只收相符的回應），後續網路外掛沿用。
    原因：rcode: <名稱>、answer: no <TYPE> records[ (truncated; set transport = "tcp")]、query:、connect:、timeout。
    實機測試用 unbound local-zone（5353，UDP 與 TCP）。
  - radius 外掛（emfor-check-radius）：emfor-check radius 預設送 Status-Server（RFC 5997），可選 Access-Request（PAP）；
    每個請求第一個屬性為 Message-Authenticator；回應必須通過 Response Authenticator 驗證，有帶 Message-Authenticator
    時一併驗證。密鑰只用 secret_file（同 password_file 規則，每次檢查重讀）。MD5/HMAC 用 Cargo.lock 已有的 md-5、hmac。
    原因：auth: Access-Reject[: Reply-Message]、auth: Access-Challenge、auth: response authenticator does not match
    (wrong secret?)、auth: Message-Authenticator does not match、auth: response has no Message-Authenticator、
    query: malformed response、query: unexpected response code <N>。不做 RadSec、CHAP/EAP、計費記錄、CoA。
    實機測試用 FreeRADIUS 3.2.1：它驗證請求的 Message-Authenticator，密鑰錯誤時不回應（結果為 timeout），
    回應也不帶 Message-Authenticator。
  - sip 外掛（emfor-check-sip）：emfor-check sip 送 OPTIONS（RFC 3261），UDP / TCP / TLS（tls 需 transport = "tcp"）；
    訊息自己組與解析（不新增套件），Via 帶本機位址（net::udp_exchange_from 在連線後才組請求）、branch、rport；
    回應以第一個 Via 的 branch、Call-ID、CSeq 比對，1xx 略過；UDP 不相符丟掉，TCP 不相符為 down。
    expect_status 預設 ["200-499"]（4xx 代表伺服器有在處理，5xx/6xx 為 down）；原因 status: <碼> <片語>、query:。
    TLS 鍵的檢查在 options::tls_settings 共用。實機測試用 Kamailio 5.6.3（5060 UDP/TCP、5061 TLS）。
  - diameter 外掛（emfor-check-diameter）：emfor-check diameter 每次檢查開新 TCP（可選 TLS）連線，CER/CEA → DWR/DWA，
    CEA 成功後一律送 DPR（Disconnect-Cause 2）、最多等 200 ms；訊息自己編解碼（不新增套件）；對端的請求忽略。
    Result-Code 2xxx 為成功，其他為 cea: / dwa: <碼> <RFC 6733 名稱>；必填 origin_host、origin_realm 與至少一個 application。
    TLS 可帶客戶端憑證 tls_cert_file / tls_key_file（RFC 6733 雙向認證，freeDiameter 要求）：emfor-tls 的
    ClientCertificate、client_config_with_client、handshake_with_config，只由 diameter 使用，TlsSettings 不變。
    實機測試用 freeDiameter 1.2.1（Debian 沒有 test_app：relay 節點 3868/5658 測 up，NoRelay 節點 3869 測 5010；未允許的 peer 回 3010）。
  - client（emfor-clients）：emfor_lookup(名稱, affinity_key?) 回傳 "ip:port"（LMDB 後端 id，IPv6 為 [ip]:port）；
    錯誤碼 UNAVAILABLE（LMDB 打不開／lock 格式不符）、INCOMPATIBLE（版本或 JSON 無法解析）、NOT_FOUND、ALL_DOWN，
    各語言依慣例回報。心跳過期（預設 max_staleness 3 秒）或歸零時所有後端視為未知，依 on_all_down 處理，
    不另設錯誤碼；全部不健康但照樣回傳時第一版不另行通知呼叫端。round-robin 每程序每服務一個 atomic 計數器、
    起點隨機；sticky 對每台後端算 MD5(affinity_key + 後端 id) 前 4 bytes big-endian 取最大，無 key 用 round-robin。
    設定只有預設值加環境變數 EMFOR_STORE、EMFOR_MAX_STALENESS；唯讀開檔、每程序開一次、fork 後重開、可多執行緒呼叫。
    跨語言共用測試資料放 tests/conformance/v1/（JSON：LMDB 內容 + 查詢 → 預期 ip:port 或錯誤碼），
    由 Rust 小工具 emfor-fixture 轉成 LMDB 檔。
    相容性驗證結果（2026-11-12，tests/spike/RESULTS.md）：系統 liblmdb 與 PHP dba 都讀不了 daemon 的 store
    （Debian 0.9.31 資料檔相容但 lock 格式不同；macOS Homebrew 1.0.3 連資料檔都不認得；Homebrew PHP 沒有 lmdb handler），
    因此 client 改為內嵌 daemon 同一份 LMDB：emfor-client 經 cargo-c 產出 libemfor，cdylib 不對外公開 mdb_* 符號，
    各語言只包裝動態函式庫（不用 .a）。libemfor 與 emfor 同版本一起發布、一起升級。
    讀取保留 MDB_NOTLS：每次交易結束歸還讀取槽；不用 MDB_NOTLS 時每條執行緒會一直佔用一個讀取槽，
    而槽數由第一個開啟 store 的行程決定，daemon 與 client 都設為 1024（emfor_format::MAX_READERS，全主機共用）。實測一次查詢 Linux 約 0.2–1.7 µs，SQLite WAL 約 2–6 µs，
    效能不是選擇依據。
  - 設定：全域 [defaults] + 每個服務覆寫（interval、timeout、rise、fall、jitter、on_all_down）；
    check_options 交給檢查器驗證；SIGHUP 重載時全部驗證通過才套用。
  - 全部不健康時預設 open（照樣回傳並標記 all_down），可依服務改 closed。
  - LMDB 退場機制：只有 cargo-c 版 libemfor 的驗證也失敗（讀不了 daemon 的 store，或同一程序載入其他 LMDB 時衝突）
    才改用 SQLite WAL（kv 表沿用現有 key 與 JSON、schema_version 升 2、persistent WAL、daemon 新增 SQLite 版 Sink），
    另開 emfor-sqlite-store；效能不構成退場理由。完整判斷步驟寫在 emfor-clients 的 design.md。

  - 狀態指令（emfor-status）：emfor status 唯讀開 store（先確認檔案存在，不取 writer lock），只讀設定檔的 [store]；
    顯示 daemon（心跳超過 3 秒為 stale、0 為 stopped）、各服務 balance / on_all_down / ALL DOWN、各後端狀態、
    檢查年齡、latency_us、fastest 的 pool 與最後失敗原因。--service、--json；結束碼 0 正常、1 daemon 沒在更新或
    顯示的服務 all down、2 讀不到設定或 store。--watch 每秒重畫、反白變化、列最近 10 筆轉換（後端轉換取自 store 歷史，daemon 狀態變化只含執行期間），
    以 crossterm 處理 raw mode 與按鍵（emfor-status-watch-scroll）：store/daemon 兩行固定，其餘以 PgUp/PgDn、方向鍵、Home/End 捲動，q 或 Ctrl-C 結束；不用 ratatui 等 TUI 框架。設定檔預設路徑在編譯時由 option_env! 讀 EMFOR_PREFIX 決定（未設或 /usr 為 /etc/emfor/emfor.toml，
    其他為 <prefix>/etc/emfor/emfor.toml），不依作業系統；store 與 client 預設不變。
    狀態歷史（emfor-status-history）：hist/<服務> 存每台後端最近 20 筆由檢查造成的轉換（at/from/to/reason），
    與 svc/ 記錄同一交易寫入，跨重啟保留、啟動與 reload 時修剪；client 與 DNS 不讀。emfor status 以
    10 分鐘內 healthy↔unhealthy 5 次以上判定抖動，標 FLAPPING，只顯示、不影響結束碼；--history 列出歷史，
    --json 多 history 與 flapping。

  支援平台：Linux 與 FreeBSD 為正式部署平台（daemon 與所有 client 都要在兩者上通過測試），
  GitHub Actions CI（含 FreeBSD VM）為選用、手動觸發，不擋 change 完成或 archive；以本機驗證為準
  （macOS 與 Debian 映像的 fmt/clippy/test、Docker 內的 dnsmasq/unbound 與 tests/plugins/run.sh、Linux VM 上的 systemd-resolved）。
  FreeBSD 目前沒有本機環境，相關檢查留在選用的 CI freebsd job，文件標明尚未在 FreeBSD 上驗證。
  macOS 僅作開發用。FreeBSD 附 rc.d 範例（不做打包）。client 與 daemon 必須用同一份 LMDB 原始碼與編譯選項，
  否則 lock 格式不同（MDB_VERSION_MISMATCH），這由 libemfor 與 daemon 共用 Cargo.lock 保證。

  跨語言相容規格（皆帶版本號，以共用測試資料把關）：LMDB 資料格式、外掛訊息格式、affinity_key 分配演算法。

  聯防群組（emfor-peers，用語見 LANGUAGE.md「聯防群組」）：同一個 site、列在 [peers] 的 daemon 以 UDP 交換訊息
  （EMP1 + HMAC-SHA256 + JSON；secret_file 每秒重讀、換密鑰後舊密鑰再簽 60 秒、再接受 120 秒；時間差 5 秒內、boot/seq 防重送；
  每秒心跳、3 秒內有訊息為存活；檢查定義摘要 = checker、check_options、timeout 的 SHA-256 前 16 bytes，不同就不聯防）。
  第一階段只做故障快速通知：healthy → unhealthy 時通知其他成員，收到者若本機仍 healthy 就立刻重查並以 200ms 連查最多 fall 次；
  通知本身不改變狀態，查詢只讀本機 store。[peers] listen 變更需重啟。
  後兩階段已在 emfor-peers 的 design.md 定案：emfor-peers-quorum（k=3 負責主機多數決、全區 down 優先、
  原因 peers 2/3: / local:、status 列出不一致）→ emfor-peers-split-checks（只有負責主機完整檢查、其他主機
  interval×5 本機 TCP 探測、成員失聯重算）。

  第一版不做：多台 emfor 共用狀態（聯防群組只交換參考資料，見上）、stick-table、DNS 名稱帶條件、DNS 轉發其他網域、發佈到套件庫、
  Docker / Kubernetes 的 DNS 部署（容器內 DNS 路徑不同，需另行設計）。

  後續規劃（已決定要做、尚未排入 change；用語見 LANGUAGE.md「分配方式的值」）：emfor-peers-quorum、emfor-peers-split-checks（聯防群組第二、三階段）。
  不做：balance = "random"（client 的 round-robin 起點本來就隨機，效果幾乎相同）。

  變更拆分：emfor-core（已完成）→ emfor-dns（含 balance 設定欄位、LMDB 欄位、DNS 端行為、resolver 部署文件、FreeBSD CI 與 rc.d 範例）
  → emfor-plugins（已完成）→ emfor-clients（相容性驗證、client-lookup 規格、共用測試資料、Rust client 與 cargo-c 產出的 libemfor）
  → emfor-clients-2（Go、Python、Perl、PHP 包裝 libemfor）→ emfor-balance-2（weighted、locality、不認得的 balance 改用 round-robin）
  → emfor-dns-srv → emfor-dns-port-warning → emfor-balance-fastest（fastest、latency_us、pool）
  → emfor-check-plugins（emfor-check 的 redis、mysql、pgsql 外掛與 emfor-plugin crate）
  → emfor-tcp-expect（tcp 檢查的 send / expect）→ emfor-tcp-tls（tcp 檢查的 TLS 與 emfor-tls crate）
  → emfor-check-ldap（emfor-check 的 ldap 外掛）→ emfor-status（emfor status 與 EMFOR_PREFIX）
  → emfor-check-dns（dns 外掛與 network-checks 規格）→ emfor-check-radius → emfor-check-sip → emfor-check-diameter
  （後三者修改 network-checks，必須依此順序實作與封存）。

