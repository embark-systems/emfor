[workspace]
resolver = "3"
members = ["crates/emfor-daemon", "crates/emfor-format", "crates/emfor-check", "crates/emfor-plugin", "tests/spike/probe", "tools/emfor-fixture", "clients/rust"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
emfor-format = { path = "crates/emfor-format" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
