[workspace]
resolver = "3"
# tests/spike/probe is a finished spike (tests/spike/RESULTS.md), built only
# by tests/spike/run.sh.
exclude = ["tests/spike/probe"]
members = ["crates/emfor-daemon", "crates/emfor-format", "crates/emfor-check", "crates/emfor-plugin", "crates/emfor-tls", "tools/emfor-fixture", "clients/rust"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "BSD-2-Clause"

[workspace.dependencies]
emfor-format = { path = "crates/emfor-format" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
