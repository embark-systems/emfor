[package]
name = "emfor-check"
description = "emfor checker plugins for redis, MySQL, PostgreSQL, LDAP, DNS, RADIUS, SIP, Diameter, SMTP, AMQP, MongoDB and gRPC"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "emfor-check"
path = "src/main.rs"

[dependencies]
emfor-plugin = { path = "../emfor-plugin" }
emfor-tls = { path = "../emfor-tls" }
hickory-proto = "0.26.3"
base64 = "0.22"
bytes = "1.12.1"
h2 = "0.4"
h3 = "=0.0.8"
h3-quinn = "=0.0.10"
hmac = "0.13"
http = "1.5.0"
libc = "0.2.191"
md-5 = "0.11"
mysql_async = { version = "0.37.1", default-features = false, features = ["minimal-rust", "rustls-tls"] }
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rand = "0.10.3"
rustls = "0.23.46"
serde_json.workspace = true
sha2 = "0.11"
tokio = { version = "1.54.1", features = ["net", "io-util", "time", "fs"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.14.0"
tokio-rustls = "0.26.6"

[dev-dependencies]
emfor-tls = { path = "../emfor-tls", features = ["testing"] }
serde_json.workspace = true
sha2 = "0.11"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }

# cargo fuzz builds with --cfg fuzzing, see fuzz/README.md.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
