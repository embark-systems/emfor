[package]
name = "emfor-check"
description = "emfor checker plugins for redis, MySQL and PostgreSQL"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "emfor-check"
path = "src/main.rs"

[dependencies]
emfor-plugin = { path = "../emfor-plugin" }
libc = "0.2.191"
mysql_async = { version = "0.37.1", default-features = false, features = ["minimal-rust", "rustls-tls"] }
rustls = "0.23.46"
rustls-native-certs = "0.8.5"
rustls-pki-types = "1.16.0"
serde_json.workspace = true
tokio = { version = "1.54.1", features = ["net", "io-util", "time", "fs"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.14.0"
tokio-rustls = "0.26.6"

[dev-dependencies]
serde_json.workspace = true
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
