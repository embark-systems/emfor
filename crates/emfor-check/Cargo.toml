[package]
name = "emfor-check"
description = "emfor checker plugins for redis, MySQL, PostgreSQL, LDAP and DNS"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "emfor-check"
path = "src/main.rs"

[dependencies]
emfor-plugin = { path = "../emfor-plugin" }
emfor-tls = { path = "../emfor-tls" }
hickory-proto = "0.26.3"
libc = "0.2.191"
mysql_async = { version = "0.37.1", default-features = false, features = ["minimal-rust", "rustls-tls"] }
rustls = "0.23.46"
serde_json.workspace = true
tokio = { version = "1.54.1", features = ["net", "io-util", "time", "fs"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.14.0"
tokio-rustls = "0.26.6"

[dev-dependencies]
emfor-tls = { path = "../emfor-tls", features = ["testing"] }
serde_json.workspace = true
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
