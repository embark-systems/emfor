[package]
name = "emfor-plugin"
description = "Write emfor checker plugins (protocol 1) in Rust"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "io-std", "io-util", "macros", "time", "sync"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full", "test-util"] }
