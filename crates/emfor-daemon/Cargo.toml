[package]
name = "emfor-daemon"
description = "emfor health-check daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "emfor"
path = "src/main.rs"

# Plugin used by emfor's own tests; see tests/support/test_plugin.rs. Built
# only with the test-plugin feature, so `cargo install` leaves it out; the
# dev-dependency on this crate below turns the feature on for `cargo test`.
[[bin]]
name = "emfor-test-plugin"
path = "tests/support/test_plugin.rs"
required-features = ["test-plugin"]

[features]
test-plugin = []
# Fault injection for emfor's own tests (EMFOR_TEST_* environment
# variables); the dev-dependency below turns it on for `cargo test`. Leave
# it off in builds you ship.
test-hooks = []

[dependencies]
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
emfor-format.workspace = true
emfor-tls = { path = "../emfor-tls" }
futures = "0.3.34"
heed = "0.22"
hmac = "0.13"
hickory-proto = "0.26.3"
hickory-server = "0.26.3"
humantime = "2.4.0"
libc = "0.2.191"
md-5 = "0.11"
nix = { version = "0.31.3", features = ["fs", "signal", "process"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2.2.2"
emfor-daemon = { path = ".", features = ["test-plugin", "test-hooks"] }
emfor-tls = { path = "../emfor-tls", features = ["testing"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util", "full"] }
tracing-test = "0.2.6"
