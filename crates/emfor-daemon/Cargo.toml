[package]
name = "emfor-daemon"
description = "emfor health-check daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "emfor"
path = "src/main.rs"

# Plugin used by emfor's own tests; see tests/support/test_plugin.rs. Built
# only with the test-plugin feature, so `cargo install` leaves it out; the
# dev-dependency on this crate below turns the feature on for `cargo test`.
[[bin]]
name = "emfor-test-plugin"
path = "tests/support/test_plugin.rs"
required-features = ["test-plugin"]

[features]
test-plugin = []
# Fault injection for emfor's own tests (EMFOR_TEST_* environment
# variables); the dev-dependency below turns it on for `cargo test`. Leave
# it off in builds you ship.
test-hooks = []

[dependencies]
async-trait = "0.1.92"
chacha20poly1305 = "=0.11.0"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
emfor-client = { path = "../../clients/rust", features = ["daemon-internal"] }
emfor-format.workspace = true
emfor-tls = { path = "../emfor-tls" }
futures = "0.3.34"
heed = "0.23"
hkdf = "=0.13.0"
hmac = "0.13"
hickory-proto = "0.26.3"
hickory-server = "0.26.3"
libc = "0.2.191"
md-5 = "0.11"
nix = { version = "0.32.0", features = ["fs", "signal", "process", "user", "inotify", "event", "poll"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zeroize = "1.9"

[dev-dependencies]
assert_cmd = "2.2.2"
emfor-daemon = { path = ".", features = ["test-plugin", "test-hooks"] }
emfor-fixture = { path = "../../tools/emfor-fixture" }
emfor-tls = { path = "../emfor-tls", features = ["testing"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util", "full"] }
tracing-test = "0.2.6"

# cargo fuzz builds with --cfg fuzzing, see fuzz/README.md.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

# The deb and rpm packages (packages/README.md): `cargo deb -p emfor-daemon`
# and `cargo generate-rpm -p crates/emfor-daemon`, run by packages/build.sh
# on binaries built with `cargo build --release -p emfor-daemon -p
# emfor-check`. The same files go into both.
[package.metadata.deb]
name = "emfor"
maintainer = "emfor maintainers"
copyright = "BSD-2-Clause, see /usr/share/doc/emfor/copyright"
license-file = ["../../LICENSE", "0"]
extended-description = """\
emfor checks the health of backends (tcp, http, exec and plugins) and keeps \
the result in a local state store that applications read directly, without \
a proxy; it can also answer DNS from that state. This package has the \
daemon, the emfor-check plugin binary, a systemd unit and the manual."""
section = "net"
priority = "optional"
# ca-certificates: an http check with scheme "https" and tls_verify on needs
# the system's root certificates (plain "http" does not, since 0.7.0).
depends = "$auto, ca-certificates"
maintainer-scripts = "../../packages/deb"
conf-files = ["/etc/emfor/emfor.toml"]
assets = [
    ["target/release/emfor", "usr/bin/", "755"],
    ["target/release/emfor-check", "usr/bin/", "755"],
    ["../../packages/common/emfor.toml", "etc/emfor/", "644"],
    ["../../packages/common/conf.d-README", "etc/emfor/conf.d/README", "644"],
    ["../../examples/emfor.toml", "usr/share/doc/emfor/examples/", "644"],
    ["../../examples/prometheus/*", "usr/share/doc/emfor/examples/prometheus/", "644"],
    ["../../docs/manual/*.md", "usr/share/doc/emfor/manual/", "644"],
    ["../../README.md", "usr/share/doc/emfor/", "644"],
]

[package.metadata.deb.systemd-units]
unit-name = "emfor"
unit-scripts = "../../packages/common"
enable = true
start = true
restart-after-upgrade = true

[package.metadata.generate-rpm]
name = "emfor"
summary = "emfor health-check daemon, with a state store applications read directly"
license = "BSD-2-Clause"
url = "https://github.com/embark-systems/emfor"
pre_install_script = "../../packages/rpm/pre.sh"
post_install_script = "../../packages/rpm/post.sh"
pre_uninstall_script = "../../packages/rpm/preun.sh"
post_uninstall_script = "../../packages/rpm/postun.sh"
assets = [
    { source = "target/release/emfor", dest = "/usr/bin/emfor", mode = "755" },
    { source = "target/release/emfor-check", dest = "/usr/bin/emfor-check", mode = "755" },
    { source = "../../packages/common/emfor.service", dest = "/usr/lib/systemd/system/emfor.service", mode = "644" },
    { source = "../../packages/common/emfor.toml", dest = "/etc/emfor/emfor.toml", mode = "644", config = "noreplace" },
    { source = "../../packages/common/conf.d-README", dest = "/etc/emfor/conf.d/README", mode = "644", config = "noreplace" },
    { source = "../../examples/emfor.toml", dest = "/usr/share/doc/emfor/examples/emfor.toml", mode = "644", doc = true },
    { source = "../../LICENSE", dest = "/usr/share/licenses/emfor/LICENSE", mode = "644", license = true },
    { source = "../../README.md", dest = "/usr/share/doc/emfor/README.md", mode = "644", doc = true },
]

# Same reason as the deb's depends: https checks need the root certificates.
[package.metadata.generate-rpm.requires]
ca-certificates = "*"
