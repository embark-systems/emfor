# emfor config. Every option, with comments, is in
# /usr/share/doc/emfor/examples/emfor.toml, and the manual is chapter 3,
# "Configuration".
#
# Put the services in files of conf.d, read in file name order (01-, 10-,
# 99-): a later file overrides an earlier one. The directory and its files
# must be owned by root and not writable by group or others.
# Check with `emfor check-config`, apply with `systemctl reload emfor`.
include_dir = "conf.d"
