[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "emfor"
version = "0.1.0"
description = "Look up a healthy backend in the local emfor state store (wraps libemfor)"
requires-python = ">=3.9"
license = { text = "see the emfor repository" }

[tool.setuptools]
packages = ["emfor"]
