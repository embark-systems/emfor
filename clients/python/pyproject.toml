[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "emfor"
version = "0.2.0"
description = "Look up a healthy backend in the local emfor state store (wraps libemfor)"
requires-python = ">=3.9"
license = { text = "BSD-2-Clause" }

[tool.setuptools]
packages = ["emfor"]
