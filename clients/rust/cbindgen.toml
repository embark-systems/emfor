language = "C"
include_guard = "EMFOR_H"
autogen_warning = "/* Generated by cbindgen from clients/rust/src/capi.rs. Do not edit. */"

# cbindgen puts every `pub` constant of the crate into the header, so only
# capi.rs has `pub` ones (all named EMFOR_*); the others are `pub(crate)`.
# clients/c/tests/check_header.sh checks the installed header.

[enum]
prefix_with_name = false
