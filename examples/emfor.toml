# Example emfor config. Validate with:
#   emfor --check-config --config examples/emfor.toml
# With [plugins] declared, --check-config starts the plugins to validate
# check_options, then stops them before it exits.

# The data centre this host is in (optional): services with
# balance = "locality" prefer backends whose site matches. Must come before
# the first table.
site = "dc1"

[store]
path = "/var/lib/emfor/state.mdb"
map_size = "64MiB"
file_mode = "0644"
# Readers (the emfor clients in your applications) register themselves in the
# "<path>-lock" file, so every application user needs write access to it.
# The default 0666 lets any local user read the store. To restrict access,
# create a group for your applications, chgrp the store files to it, and use:
#   lock_file_mode = "0660"
#   file_mode = "0640"
lock_file_mode = "0666"

[log]
level = "info"

# DNS server for programs without an emfor client. Remove this table to turn
# it off. The host's resolver forwards the zone here; see
# docs/deploy/dns-resolver.md. Changing listen requires a restart.
[dns]
listen = ["127.0.0.1:5300"]  # not 5353: that is mDNS
zone = "svc.emfor"           # only services named under the zone resolve
ttl = "1s"                   # whole seconds, 0s to 3600s

# Built-in defaults, shown here explicitly. Any service can override them.
[defaults]
interval = "2s"        # time between the end of one check and the start of the next
timeout = "1s"         # must not exceed interval
rise = 2               # consecutive passes before a backend is healthy
fall = 3               # consecutive failures before a backend is unhealthy
jitter = "10%"         # random +/- spread of interval, 0% to 50%
on_all_down = "open"   # "open": readers still pick a backend; "closed": readers fail
balance = "round-robin" # "round-robin", "sticky" (by affinity key), "failover",
                        # "weighted" (by backend weight), "locality" (same site first)
                        # or "fastest" (backends whose checks answer fastest, in turn)

# A plain TCP service: a backend is up when it accepts a connection.
[services."db.svc.emfor"]
check = "tcp"
backends = ["10.0.1.5:5432", "10.0.1.6:5432"]
on_all_down = "closed"
balance = "failover"   # always the first healthy backend in this order

# An HTTP service, checked every second.
[services."api.svc.emfor"]
check = "http"
backends = ["10.0.0.11:8080", "10.0.0.12:8080", "[2001:db8::11]:8080"]
interval = "1s"
dns_ttl = "5s"         # overrides [dns] ttl for this service

[services."api.svc.emfor".check_options]
path = "/healthz"
scheme = "http"              # or "https"
host_header = "api.internal" # optional
expect_status = ["200-299"]  # default ["200-399"]

# Weighted: over every 5 choices, 10.0.4.12 is chosen 3 times and the others
# once each. A backend is a string, or a table with addr and optional
# weight (1 to 100, default 1) and site.
[services."search.svc.emfor"]
check = "tcp"
balance = "weighted"
backends = [
  "10.0.4.11:9200",
  { addr = "10.0.4.12:9200", weight = 3 },
  "10.0.4.13:9200",
]

# Locality: backends in this host's site (dc1) while any of them is healthy,
# otherwise the other sites; round-robin among them.
[services."cache.svc.emfor"]
check = "tcp"
balance = "locality"
backends = [
  { addr = "10.0.5.11:6379", site = "dc1" },
  { addr = "10.0.5.12:6379", site = "dc1" },
  { addr = "10.1.5.11:6379", site = "dc2" },
]

# A Nagios-style check script, run once per check without a shell. The
# backend is in EMFOR_IP, EMFOR_PORT and EMFOR_SERVICE. Exit 0 is up; 1 or 2
# is down (reason: first line of stdout); any other exit code is an error,
# which does not count against the backend. A script still running at
# `timeout` is killed with all its children and counts as down.
# Commented out because the script does not exist on a fresh host.
#
# [services."report.svc.emfor"]
# check = "exec"
# backends = ["10.0.3.1:5432"]
# interval = "10s"     # exec starts a process per check; for frequent checks use a plugin
# timeout = "5s"
#
# [services."report.svc.emfor".check_options]
# command = ["/usr/local/libexec/check_pg_replication", "--max-lag", "60"]

# A plugin: a long-running program, shared by every service that uses it,
# speaking line-delimited JSON on stdin/stdout. See
# docs/plugins/protocol-v1.md. The plugin validates check_options itself.
# emfor-check is the plugin that ships with emfor; its argument picks
# redis, mysql or pgsql. See docs/deploy/plugins.md for every option.
# Commented out because emfor-check is not installed on a fresh host.
#
# [plugins."redis"]
# command = ["/usr/local/libexec/emfor-check", "redis"]
#
# [services."sessions.svc.emfor"]
# check = "redis"      # the plugin name
# backends = ["10.0.2.1:6379", "10.0.2.2:6379"]
#
# [services."sessions.svc.emfor".check_options]
# user = "emfor"
# password_file = "/etc/emfor/redis.pass"   # never the password itself
# role = "master"                           # only the master is healthy
