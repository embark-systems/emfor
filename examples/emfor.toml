# Example emfor config. Validate with:
#   emfor check-config --config examples/emfor.toml
# With [plugins] declared, check-config starts the plugins to validate
# check_options, then stops them before it exits.

# The data centre this host is in (optional): services with
# balance = "locality" prefer backends whose site matches; required with
# [peers]. Must come before the first table.
site = "dc1"

[store]
path = "/var/lib/emfor/state.mdb"
map_size = "64MiB"
file_mode = "0644"
# Readers (the emfor clients in your applications) register themselves in the
# "<path>-lock" file, so every application user needs write access to it.
# The default 0666 lets any local user not only read the store but also
# write the lock file, which holds LMDB's reader table and write lock: a
# hostile local user can stop the daemon's commits (every client then sees
# a stale store) or make lookups read pages being rewritten. Keep 0666 only
# where every local user is trusted. Otherwise run the daemon with a group
# that only your applications' users are in, and use:
#   lock_file_mode = "0660"
#   file_mode = "0640"
# See "Who can use the store" in docs/deploy/daemon.md.
lock_file_mode = "0666"
# Commits do not wait for the disk by default, so a slow or stalled disk
# cannot make the store look stale to every client. The store is rewritten
# on every start; after a power loss it may be damaged, and the daemon then
# moves it to "<path>.corrupt" and starts with a new one (the state history
# for "emfor status --history" is lost). Set true to flush every commit.
sync = false

[log]
level = "info"

# DNS server for programs without an emfor client. Remove this table to turn
# it off. The host's resolver forwards the zone here; see
# docs/deploy/dns-resolver.md. Changing listen requires a restart.
[dns]
listen = ["127.0.0.1:5300"]  # not 5353: that is mDNS
zone = "svc.emfor"           # only services named under the zone resolve
ttl = "1s"                   # whole seconds, 0s to 3600s

# Prometheus metrics at http://<listen>/metrics. Uncomment to turn it on;
# see docs/deploy/daemon.md. Changing listen requires a restart.
# [metrics]
# listen = ["127.0.0.1:5301"]

# Peer group: the emfor daemons of this site that pass backend failures on
# to each other over UDP (see docs/manual/03-configuration.md). Every member
# lists the same members, including itself; listen is this host's entry.
# The secret file needs at least 32 bytes and mode 0600 or 0640.
# Changing listen requires a restart; members and secret_file reload.
# A service with peers = false (below) stays out of the group; the host
# tells the other members, which then leave it out of that service's
# assigned checkers (every member needs this version for that).
# [peers]
# listen = "10.0.0.5:5302"
# members = ["10.0.0.5:5302", "10.0.0.6:5302", "10.0.0.7:5302"]
# secret_file = "/etc/emfor/peers.key"

# Built-in defaults, shown here explicitly. Any service can override them.
[defaults]
interval = "2s"        # time between the end of one check and the start of the next
timeout = "1s"         # must not exceed interval
rise = 2               # consecutive passes before a backend is healthy
fall = 3               # consecutive failures before a backend is unhealthy
jitter = "10%"         # random +/- spread of interval, 0% to 50%
on_all_down = "open"   # "open": readers still pick a backend; "closed": readers fail
balance = "round-robin" # "round-robin", "sticky" (by affinity key), "failover",
                        # "weighted" (by backend weight), "locality" (same site first)
                        # or "fastest" (backends whose checks answer fastest, in turn)
peers = true           # take part in the peer group, when [peers] is set
# slow_start = "30s"   # a backend that recovers gets a growing share over
                       # this time; "0s" (default) is off, else 1s to 1h

# A plain TCP service: a backend is up when it accepts a connection.
[services."db.svc.emfor"]
check = "tcp"
backends = ["10.0.1.5:5432", "10.0.1.6:5432"]
on_all_down = "closed"
balance = "failover"   # always the first healthy backend in this order

# A TCP service checked by its greeting: up when the backend's first bytes
# contain expect. The checker reads at most 16384 bytes, then closes the
# connection right away (no QUIT). A miss is down with a reason such as
# expect: got "421 too busy\r\n" (the first 64 bytes received).
[services."smtp.svc.emfor"]
check = "tcp"
backends = ["10.0.6.11:25", "10.0.6.12:25"]
check_options = { expect = "220" }

# send is written after connecting, then the response must contain expect.
# TOML escapes such as \r\n are sent as those bytes.
[services."memcache.svc.emfor"]
check = "tcp"
backends = ["10.0.7.11:11211", "10.0.7.12:11211"]

[services."memcache.svc.emfor".check_options]
send = "stats\r\n"
expect = "STAT pid"

# TLS: the checker completes a TLS handshake (no plaintext fallback) and
# verifies the certificate against server_name (default: the backend IP)
# using the system's CA certificates, or ca_file. tls_verify = false still
# encrypts but accepts any certificate. With expect, send and expect run
# over TLS. The options mean the same as in emfor-check.
[services."imap.svc.emfor"]
check = "tcp"
backends = ["10.0.8.11:993", "10.0.8.12:993"]

[services."imap.svc.emfor".check_options]
tls = true
server_name = "imap.internal"
# ca_file = "/etc/emfor/internal-ca.pem"  # read by check-config; must exist
expect = "* OK"

# An HTTP service, checked every second.
[services."api.svc.emfor"]
check = "http"
backends = ["10.0.0.11:8080", "10.0.0.12:8080", "[2001:db8::11]:8080"]
interval = "1s"
dns_ttl = "5s"         # overrides [dns] ttl for this service

[services."api.svc.emfor".check_options]
path = "/healthz"
scheme = "http"              # or "https"
host_header = "api.internal" # optional
expect_status = ["200-299"]  # default ["200-399"]
expect_body = '"status":"UP"' # optional: the body must contain this

# Weighted: over every 5 choices, 10.0.4.12 is chosen 3 times and the others
# once each. A backend is a string, or a table with addr and optional
# weight (1 to 100, default 1) and site.
[services."search.svc.emfor"]
check = "tcp"
balance = "weighted"
backends = [
  "10.0.4.11:9200",
  { addr = "10.0.4.12:9200", weight = 3 },
  "10.0.4.13:9200",
]

# Locality: backends in this host's site (dc1) while any of them is healthy,
# otherwise the other sites; round-robin among them.
[services."cache.svc.emfor"]
check = "tcp"
balance = "locality"
backends = [
  { addr = "10.0.5.11:6379", site = "dc1" },
  { addr = "10.0.5.12:6379", site = "dc1" },
  { addr = "10.1.5.11:6379", site = "dc2" },
]

# A Nagios-style check script, run once per check without a shell. The
# backend is in EMFOR_IP, EMFOR_PORT and EMFOR_SERVICE. Exit 0 is up; 1 or 2
# is down (reason: first line of stdout); any other exit code is an error,
# which does not count against the backend. A script still running at
# `timeout` is killed with all its children and counts as down.
# Commented out because the script does not exist on a fresh host.
#
# [services."report.svc.emfor"]
# check = "exec"
# backends = ["10.0.3.1:5432"]
# interval = "10s"     # exec starts a process per check; for frequent checks use a plugin
# timeout = "5s"
#
# [services."report.svc.emfor".check_options]
# command = ["/usr/local/libexec/check_pg_replication", "--max-lag", "60"]

# A plugin: a long-running program, shared by every service that uses it,
# speaking line-delimited JSON on stdin/stdout. See
# docs/plugins/protocol-v1.md. The plugin validates check_options itself.
# emfor-check is the plugin that ships with emfor; its argument picks
# redis, mysql, pgsql, ldap, dns, radius, sip, diameter, smtp, amqp,
# mongodb or grpc. See docs/deploy/plugins.md for every option.
