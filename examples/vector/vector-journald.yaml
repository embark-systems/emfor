# Vector reading emfor's JSON log from the journal (systemd).
# See docs/manual/14-integrations.md, section "Vector".
# emfor.toml needs [log] format = "json".
# The journald source keeps its place in the journal here.
data_dir: /var/lib/vector

sources:
  emfor_log:
    type: journald
    include_units: ["emfor"]

transforms:
  emfor_json:
    type: remap
    inputs: [emfor_log]
    drop_on_error: true
    source: |
      # Lines that are not JSON (the text lines before the config is read) fail
      # here, and drop_on_error drops them; without it Vector passes them on.
      . = parse_json!(.message)

sinks:
  out_log:
    type: file
    inputs: [emfor_json]
    path: /tmp/out-journald.ndjson
    encoding: { codec: json }
